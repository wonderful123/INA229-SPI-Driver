[platformio]
src_dir = .
default_envs = BasicReadings

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps = symlink://..
build_src_filter = -<*> +<PlatformIO.cpp>

[env:BasicReadings]
build_flags = ${env.build_flags} -DINA229_EXAMPLE_BASIC

[env:AllMeasurements]
build_flags = ${env.build_flags} -DINA229_EXAMPLE_ALL

[env:EnergyAndCharge]
build_flags = ${env.build_flags} -DINA229_EXAMPLE_ENERGY

[env:PrecisionAndTemperature]
build_flags = ${env.build_flags} -DINA229_EXAMPLE_PRECISION

[env:DiagnosticsAndRecovery]
build_flags = ${env.build_flags} -DINA229_EXAMPLE_DIAGNOSTICS
