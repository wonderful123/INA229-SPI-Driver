name: Library packaging
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-packaging.yml-${{ github.ref }}
  cancel-in-progress: false
jobs:
  arduino:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/arduino-lint-action@v3
        with:
          compliance: strict
          library-manager: 'false'
      - name: Install verified Arduino CLI 1.3.1
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error \
            https://github.com/arduino/arduino-cli/releases/download/v1.3.1/arduino-cli_1.3.1_Linux_64bit.tar.gz \
            --output arduino-cli_1.3.1_Linux_64bit.tar.gz
          curl --fail --location --silent --show-error \
            https://github.com/arduino/arduino-cli/releases/download/v1.3.1/1.3.1-checksums.txt \
            --output arduino-checksums.txt
          awk '$2 == "arduino-cli_1.3.1_Linux_64bit.tar.gz"' arduino-checksums.txt | sha256sum --check --strict
          tar -xzf arduino-cli_1.3.1_Linux_64bit.tar.gz arduino-cli
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install ESP32 core
        run: >-
          arduino-cli core install esp32:esp32@3.3.12
          --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile every Arduino example with warnings enabled
        run: |
          for sketch in examples/*/*.ino; do
            arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all \
              --library . "$(dirname "$sketch")"
          done
  platformio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.18
      - name: Pack library
        run: pio pkg pack --output /tmp/INA229-SPI-Driver.tar.gz
      - name: Compile every example against the archive
        run: |
          mkdir -p /tmp/ina229-project/src
          cat > /tmp/ina229-project/platformio.ini <<'INI'
          [env:esp32dev]
          platform = espressif32@6.10.0
          board = esp32dev
          framework = arduino
          build_unflags = -std=gnu++11
          build_flags = -std=gnu++17
          lib_deps = /tmp/INA229-SPI-Driver.tar.gz
          INI
          for sketch in examples/*/*.ino; do
            rm -f /tmp/ina229-project/src/*.ino
            cp "$sketch" /tmp/ina229-project/src/
            pio run -d /tmp/ina229-project
          done
      - name: Verify local example configuration
        run: pio run -d examples -e BasicReadings
      - name: Validate release versions and archives
        run: python scripts/package_release.py
